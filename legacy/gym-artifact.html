<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gym Manager Pro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap">
<style>
/* Colors and shapes come from themes.css (generated): four looks x light/night.
   Here everything reads var(--token) so a look only changes tokens. */
:root { --font-body: 'Jost', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --font-mono: 'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-inline: 0; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: var(--h-weight); letter-spacing: .01em; text-wrap: balance; font-variant-numeric: lining-nums; }
h2 { font-size: calc(26px * var(--ds)); } h3 { font-size: calc(22px * var(--ds)); }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); } .small { font-size: 13px; }
.cap { font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side-bg); color: var(--side-ink); display: flex; flex-direction: column; gap: 14px; padding: 18px 12px 14px; position: sticky; top: 0; align-self: start; height: 100vh; max-height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 6px; }
.brand b { font-family: var(--font-display); font-size: calc(24px * var(--ds)); letter-spacing: .1em; text-transform: var(--h-case); color: var(--side-strong); line-height: 1; font-weight: 700; }
.brand small { display: block; font-size: 10.5px; letter-spacing: .32em; color: var(--plate); text-transform: uppercase; margin-top: 4px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border: 0; border-radius: var(--r-ctl); background: none; color: var(--side-ink); text-align: left; cursor: pointer; font-weight: 500; width: 100%; }
.nav button:hover { background: var(--side-hover); }
.nav button[aria-current="page"] { background: var(--side-hover); color: var(--side-strong); }
.nav button[aria-current="page"] svg { color: var(--plate); }
.nav svg { width: 18px; height: 18px; flex: none; color: var(--side-ink-2); }
.nav .sep { height: 1px; background: var(--side-line); margin: 8px 6px; }
.qci { background: var(--side-hover); border: 1px solid var(--side-line); border-radius: var(--r-card); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.qci .cap { color: var(--side-ink-2); }
.qci input { background: var(--side-bg); border: 1px solid var(--side-line); color: var(--side-strong); border-radius: var(--r-ctl); padding: 8px 10px; width: 100%; }
.qci input::placeholder { color: var(--side-ink-2); }
.qci-list { display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow-y: auto; }
.qci-item { display: flex; align-items: center; gap: 8px; padding: 6px 4px 6px 6px; border-radius: var(--r-ctl); }
.qci-item span.n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.qci-item .btn { padding: 3px 9px; background: var(--plate); color: #000; border-color: var(--plate); font-weight: 600; }
.qci-item .btn[disabled] { background: transparent; color: var(--side-ink-2); border-color: var(--side-line); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px 8px 0; border-top: 1px solid var(--side-line); }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who b { display: block; color: var(--side-strong); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.who small { color: var(--side-ink-2); text-transform: capitalize; }
.side .btn { background: transparent; border-color: var(--side-line); color: var(--side-ink); }
.side :focus-visible { outline-color: var(--plate); }
.side .btn:hover { background: var(--side-hover); }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.topbar h1 { font-size: calc(32px * var(--ds)); flex: 1; min-width: 0; text-transform: var(--h-case); letter-spacing: var(--h-track); font-weight: var(--h-weight); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.view { padding: 22px 24px 60px; display: flex; flex-direction: column; gap: 18px; max-width: 1280px; width: 100%; }
.scrim { display: none; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: var(--r-ctl); border: 1px solid var(--control); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 500; line-height: 1.2; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn-primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
.btn-primary:hover { background: var(--brand); filter: brightness(1.15); }
.btn-danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn-danger.solid { background: var(--bad); color: var(--bg); border-color: var(--bad); }
.btn-sm { padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { padding: 6px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .lbl { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.field input, .field select, .field textarea, .search input, select.inline { width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--control); border-radius: var(--r-ctl); background: var(--surface); }
.field textarea { min-height: 64px; resize: vertical; }
.field .hint { font-size: 12px; color: var(--ink-3); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--control); border-radius: var(--r-ctl); background: var(--surface); cursor: pointer; font-size: 13px; }
.checks input:checked + span { font-weight: 700; }
.checks label:has(input:checked) { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.search { position: relative; flex: 1; min-width: 200px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ink-3); }
.search input { padding-left: 34px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar .grow { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--control); border-radius: var(--r-ctl); overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; font-weight: 500; border-right: 1px solid var(--control); display: inline-flex; gap: 7px; align-items: center; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.seg .ct { font-size: 12px; opacity: .75; font-variant-numeric: tabular-nums; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); min-width: 0; }
.card > header { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.card > header h3 { flex: 1; min-width: 0; }
.card .body { padding: 16px; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.cols-3 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .cap { display: flex; align-items: center; gap: 7px; }
.tile .cap i { width: 9px; height: 9px; border-radius: 2px; background: var(--ink-3); flex: none; }
.tile .v { font-family: var(--font-display); font-size: calc(44px * var(--ds)); font-weight: 600; line-height: 1.02; font-variant-numeric: lining-nums tabular-nums; overflow-wrap: break-word; }
.tile .v small { display: inline-block; white-space: nowrap; font-size: 14px; font-weight: 500; color: var(--ink-3); margin-left: 5px; font-family: var(--font-body); letter-spacing: .08em; }
.tile .s { font-size: 12.5px; color: var(--ink-3); }
.dot-ok { background: var(--ok) !important; } .dot-frozen { background: var(--frozen) !important; } .dot-bad { background: var(--bad) !important; } .dot-warn { background: var(--plate) !important; }
.banner { padding: 10px 14px; border-radius: var(--r-card); background: var(--warn-bg); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); font-size: 13px; }
.banner.bad { background: var(--bad-bg); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-3); }
.empty b { display: block; color: var(--ink-2); font-family: var(--font-display); font-size: calc(22px * var(--ds)); margin-bottom: 4px; font-weight: 600; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.active, .chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.frozen { background: var(--frozen-bg); color: var(--frozen); }
.chip.expired, .chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.plain::before { display: none; }

.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 9px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl tbody tr.me { background: var(--surface-2); }
.tbl tbody tr.me td:first-child { box-shadow: inset 3px 0 0 var(--brand); }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .act { text-align: right; white-space: nowrap; }
.tbl .act .btn { margin-left: 4px; }
.who-cell { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who-cell a, .link { background: none; border: 0; padding: 0; font-weight: 600; cursor: pointer; text-align: left; text-decoration: none; color: var(--ink); }
.who-cell a:hover, .link:hover { text-decoration: underline; }
.who-cell small { display: block; color: var(--ink-3); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); object-fit: cover; display: grid; place-items: center; font-weight: 600; font-size: 13px; color: var(--ink-2); flex: none; overflow: hidden; }
.avatar.lg { width: 84px; height: 84px; font-size: calc(26px * var(--ds)); font-family: var(--font-display); }
.pager { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line-2); flex-wrap: wrap; }
.pager .grow { flex: 1; }
.list { display: flex; flex-direction: column; }
.list > div { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line-2); min-width: 0; }
.list > div:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 8px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); }
.bar.warn > i { background: var(--plate); } .bar.bad > i { background: var(--bad); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.profile { display: flex; gap: 18px; padding: 18px; flex-wrap: wrap; align-items: flex-start; }
.profile .info { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 8px; }
.profile h2 { font-size: calc(38px * var(--ds)); }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.rank { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 4px; font-family: var(--font-display); font-weight: 700; font-size: calc(19px * var(--ds)); font-variant-numeric: lining-nums; background: var(--surface-2); color: var(--ink-2); }
.rank.r1 { background: #D2B68A; color: #000; } .rank.r2 { background: #B7B7B7; color: #000; } .rank.r3 { background: #222052; color: #EEE5D3; border: 1px solid #5C5AA0; }
.mono { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.act-chip { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }

/* ---------- charts ---------- */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-3); font-family: var(--font-body); font-size: 11px; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .cb { fill: var(--bar); }
.chart .cb.hi { fill: var(--bar-hi); stroke: var(--bar); stroke-width: 1.5; }
.chart .val { fill: var(--ink-2); font-weight: 600; }
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hbars .row { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.hbars .row .bar > i { background: var(--bar); }

/* ---------- modal and toast ---------- */
.modal-wrap { position: fixed; inset: 0; z-index: 60; background: rgba(8, 11, 15, .55); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px; overflow-y: auto; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-modal); width: 100%; max-width: 520px; box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
.modal.wide { max-width: 700px; }
.modal > header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line-2); }
.modal > header h3 { flex: 1; font-size: calc(22px * var(--ds)); }
.modal form { display: flex; flex-direction: column; }
.modal .mb { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.modal footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line-2); flex-wrap: wrap; }
.form-error { background: var(--bad-bg); color: var(--bad); border-radius: var(--r-ctl); padding: 8px 12px; font-size: 13px; font-weight: 500; }
.photo-pick { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.sub-box { border: 1px dashed var(--line); border-radius: var(--r-card); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
#toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: flex; flex-direction: column; gap: 8px; width: min(380px, calc(100vw - 32px)); pointer-events: none; }
.toast { pointer-events: auto; background: var(--brand); color: var(--brand-ink); border-radius: var(--r-card); padding: 11px 14px; display: flex; gap: 10px; align-items: flex-start; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); font-weight: 500; animation: tin .18s ease-out; }
.toast i { width: 9px; height: 9px; border-radius: 50%; background: var(--toast-dot); margin-top: 7px; flex: none; }
.toast.err i { background: var(--toast-err); }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
.boot { min-height: 100%; display: grid; place-items: center; color: var(--ink-3); font-family: var(--font-display); font-size: 22px; letter-spacing: .08em; text-transform: var(--h-case); }

/* ---------- login ---------- */
.login { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); min-height: 100%; }
.login-art { background: var(--side-bg); color: var(--side-strong); padding: 40px 44px; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; position: relative; overflow: hidden; }
.login-art h1 { font-size: calc(clamp(54px, 8.5vw, 110px) * (.55 + var(--ds) * .45)); line-height: .95; letter-spacing: calc(var(--h-track) / 2); text-transform: var(--h-case); font-weight: var(--h-weight); }
.login-art h1 span { color: var(--plate); display: block; letter-spacing: .3em; font-size: .42em; font-weight: 500; margin-top: 14px; }
.login-art .rule { width: 1px; height: 64px; background: var(--plate); opacity: .7; }
.login-art p { color: var(--side-ink-2); max-width: 38ch; }
.login-art svg { width: min(100%, 420px); height: auto; }
.login-form { display: flex; align-items: center; justify-content: flex-start; padding: 40px 48px; position: relative; }
.login-top { position: absolute; top: 18px; right: 18px; display: flex; gap: 8px; align-items: center; }
.login-form form { width: min(100%, 360px); display: flex; flex-direction: column; gap: 14px; }
.login-form h2 { font-size: calc(40px * var(--ds)); text-transform: var(--h-case); letter-spacing: var(--h-track); }

/* wide screens only: the menu button hides the sidebar; narrow screens use the drawer below, so nav-hidden is ignored there */
@media not all and (max-width: 960px) {
  .app.nav-hidden { grid-template-columns: minmax(0, 1fr); }
  .app.nav-hidden .side { display: none; }
}
@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 50; left: 0; top: 0; width: 280px; transform: translateX(-102%); transition: transform .2s; padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
  .side.open { transform: none; }
  .scrim.on { display: block; position: fixed; inset: 0; z-index: 40; background: rgba(8, 11, 15, .5); }
  .topbar { padding: 10px 16px; } .topbar h1 { font-size: calc(24px * var(--ds)); letter-spacing: .05em; }
  .view { padding: 16px 16px 60px; }
  .cols, .cols-3 { grid-template-columns: minmax(0, 1fr); }
  .login { grid-template-columns: minmax(0, 1fr); }
  .login-art { padding: 28px 20px; gap: 18px; } .login-art svg { width: 200px; }
  .login-form { padding: 26px 20px 40px; }
}
@media (max-width: 560px) {
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile .v { font-size: 30px; }
  .hide-sm { display: none; }
  .login-form { padding-top: 68px; }   /* room for the language and theme switches above the form */
  .tbl th, .tbl td { padding: 9px 10px; }
  .modal-wrap { padding: 12px; }
  .hbars .row { grid-template-columns: 78px minmax(0, 1fr) auto; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

/* ---------- settings ---------- */
.set-wrap { display: flex; flex-direction: column; gap: 18px; max-width: 760px; }
.set-card .body { display: flex; flex-direction: column; gap: 12px; }
.set-card h3 { text-transform: var(--h-case); letter-spacing: var(--h-track); }
.opt-row { display: flex; flex-wrap: wrap; gap: 10px; }
.opt { flex: 1 1 140px; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 14px; border: 1px solid var(--control); border-radius: var(--r-ctl); background: var(--surface); cursor: pointer; font-weight: 500; text-align: center; }
.opt:hover { background: var(--surface-2); }
.opt[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
.opt svg { width: 16px; height: 16px; flex: none; }
.look-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.look { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; text-align: left; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); cursor: pointer; min-width: 0; position: relative; }
.look:hover { border-color: var(--control); }
.look[aria-pressed="true"] { border: 2px solid var(--brand); padding: 13px; background: var(--surface-2); }
.look b { font-family: var(--font-display); font-size: calc(22px * var(--ds)); font-weight: 600; line-height: 1.1; }
.look span.d { font-size: 13px; color: var(--ink-3); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
/* ==========================================================================
   Gym Manager Pro: core (dates, data model, business rules)

var GYM = (function () {
  var TZ = 'Asia/Tashkent';
  var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var WEEK = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var EXPENSE_CATS = ['rent', 'salary', 'repair', 'equipment', 'utilities', 'marketing', 'shop stock', 'other'];
  var STOCK_CAT = 'shop stock';           /* expense category used when stock bought for the shop is recorded as an expense */
  var INCOME_CATS = ['personal training', 'day pass', 'locker rental', 'other'];
  var PAY_CATS = ['membership', 'personal training', 'shop', 'other'];
  var STAFF_ROLES = ['admin'];            /* the only staff role */
  var MEMBER_ROLE = 'member';             /* login of a gym member: sees only their own profile and the rankings */
  var ROLES = STAFF_ROLES.slice();        /* roles an admin can hand out on the User Roles page ('member' is created from a member's profile, never here) */
  var SHARDED = { visits: 1, txns: 1, sales: 1, audit: 1 };
  var TABLES = ['users', 'clients', 'subs', 'measurements', 'products', 'expenses', 'visits', 'txns', 'sales', 'audit'];
  var PBKDF2_ITER = 150000;

  class AppError extends Error {
    constructor(m) { super(m); this.name = 'AppError'; }
  }

  /* ---------- time (Asia/Tashkent) and dates as YYYY-MM-DD strings ---------- */
  var fixedNow = null;
  var tzFmt = new Intl.DateTimeFormat('en-US', {
    timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23', weekday: 'short'

    var p = {};

    var date = p.year + '-' + p.month + '-' + p.day;
    return { date: date, time: p.hour + ':' + p.minute, dow: p.weekday, iso: date + 'T' + p.hour + ':' + p.minute + ':' + p.second };
  }
  function setClock(ms) { fixedNow = ms; }
  function dayNum(s) {
    var a = String(s).slice(0, 10).split('-').map(Number);
    return Math.round(Date.UTC(a[0], a[1] - 1, a[2]) / 86400000);
  }
  function fromDayNum(n) { return new Date(n * 86400000).toISOString().slice(0, 10); }
  function addDays(s, n) { return fromDayNum(dayNum(s) + n); }
  function diffDays(a, b) { return dayNum(b) - dayNum(a); }
  function dowOf(s) { return DOW[new Date(dayNum(s) * 86400000).getUTCDay()]; }
  function isDate(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    return fromDayNum(dayNum(s)) === s;
  }
  function fmtDate(s) { return s ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) : '—'; }
  function fmtDT(iso) { return iso ? fmtDate(iso) + ' ' + iso.slice(11, 16) : '—'; }
  function monthsBetween(a, b) {
    var y1 = +a.slice(0, 4), m1 = +a.slice(5, 7), d1 = +a.slice(8, 10);
    var y2 = +b.slice(0, 4), m2 = +b.slice(5, 7), d2 = +b.slice(8, 10);
    var m = (y2 - y1) * 12 + (m2 - m1) - (d2 < d1 ? 1 : 0);
    return Math.max(0, m);
  }
  function monthLabel(ym) {
    var names = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    return names[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
  }
  function round2(x) { return Math.round(x * 100) / 100; }
  function fmtMoney(n) {
    n = Number(n) || 0;
    var neg = n < 0; n = Math.abs(Math.round(n));
    return (neg ? '-' : '') + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  /* ---------- state ---------- */
  function emptyState() { var s = {}; TABLES.forEach(function (t) { s[t] = {}; }); return s; }
  var S = emptyState();
  var idxCache = null;
  var rev = 0;
  function touch() { rev++; idxCache = null; }

  /* persistence hooks, filled in by the page */
  var Store = {
    readOnly: false,
    write: function () {}, remove: function () {}, replaceAll: function () {}
  };
  function needWrite() {
    if (Store.readOnly) throw new AppError('This view is read-only. Changes cannot be saved.');
  }
  function put(t, rec) { needWrite(); S[t][rec.id] = rec; touch(); Store.write(t, rec); return rec; }
  function del(t, id) {
    var rec = S[t][id]; if (!rec) return;
    needWrite(); delete S[t][id]; touch(); Store.remove(t, rec);
  }
  function values(t) { return Object.keys(S[t]).map(function (k) { return S[t][k]; }); }

  /* apply a document that arrived from the shared database */
  function applyRemote(t, docId, body) {
    if (!(t in S)) return false;
    function byId(a, b) { return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; }
    if (SHARDED[t]) {
      var cur = values(t).filter(function (r) { return r.d === docId; }).sort(byId);
      var next = body && Array.isArray(body.items) ? body.items.slice().sort(byId) : [];

    }
    var old = S[t][docId];
    if (body == null) { if (!old) return false; delete S[t][docId]; touch(); return true; }
    if (JSON.stringify(old) === JSON.stringify(body)) return false;
    S[t][docId] = body; touch(); return true;
  }
  function shardItems(t, d) { return values(t).filter(function (r) { return r.d === d; }); }
  function allDocPaths(state) {
    var out = {};
    TABLES.forEach(function (t) {
      Object.keys(state[t]).forEach(function (k) {
        var r = state[t][k];
        out[t + '/' + (SHARDED[t] ? r.d : r.id)] = [t, SHARDED[t] ? r.d : r.id];
      });
    });
    return out;
  }
  function loadState(obj) {
    var s = emptyState();
    TABLES.forEach(function (t) { if (obj && obj[t]) s[t] = obj[t]; });
    S = s; touch();
  }

  /* ---------- derived lookups ---------- */
  function idx() {
    if (idxCache) return idxCache;
    var subsBy = {}, visitsBy = {}, payBy = {}, byDate = {}, lastVisit = {}, activeSub = {};
    values('subs').forEach(function (s) { (subsBy[s.client] || (subsBy[s.client] = [])).push(s); });
    Object.keys(subsBy).forEach(function (k) {
      subsBy[k].sort(function (a, b) {
        return (b.start_date || '').localeCompare(a.start_date || '') || (b.created_at || '').localeCompare(a.created_at || '');
      });
      activeSub[k] = subsBy[k].find(function (s) { return s.is_active; }) || null;
    });
    values('visits').forEach(function (v) {
      (visitsBy[v.client] || (visitsBy[v.client] = [])).push(v);
      byDate[v.visit_date] = (byDate[v.visit_date] || 0) + 1;
    });
    Object.keys(visitsBy).forEach(function (k) {
      visitsBy[k].sort(function (a, b) { return (b.visit_date + b.visit_time).localeCompare(a.visit_date + a.visit_time); });
      lastVisit[k] = visitsBy[k][0].visit_date;
    });
    values('txns').forEach(function (t) {
      if (t.txn_type === 'payment' && t.client) payBy[t.client] = (payBy[t.client] || 0) + t.amount;
    });
    idxCache = { subsBy: subsBy, activeSub: activeSub, visitsBy: visitsBy, lastVisit: lastVisit, payBy: payBy, byDate: byDate };
    return idxCache;
  }

  /* ---------- subscription and member status rules ---------- */
  function subRemaining(sub, today) {
    today = today || now().date;
    if (sub.sub_type === 'sessions') return Math.max(0, sub.total_sessions - sub.used_sessions);
    return Math.max(0, diffDays(today, sub.end_date));
  }
  function subState(sub, today) {
    today = today || now().date;
    if (sub.sub_type === 'sessions') {
      if (sub.used_sessions >= sub.total_sessions) return 'finished';
      if (sub.end_date && sub.end_date < today) return 'expired';
      return 'ok';
    }
    return sub.end_date < today ? 'expired' : 'ok';
  }
  function planLabel(sub) {
    if (!sub) return 'No plan';
    if (sub.sub_type === 'sessions') return sub.total_sessions + ' sessions';
    var d = diffDays(sub.start_date, sub.end_date) + 1;
    return d + ' days';
  }
  function clientStatus(c, today) {
    if (c.status === 'frozen') return 'frozen';
    var s = idx().activeSub[c.id];
    if (!s) return 'expired';
    return subState(s, today || now().date) === 'ok' ? 'active' : 'expired';
  }
  function activeSub(cid) { return idx().activeSub[cid] || null; }
  function subsOf(cid) { return idx().subsBy[cid] || []; }
  function visitsOf(cid) { return idx().visitsBy[cid] || []; }

  /* ---------- session and permissions ---------- */
  var sessionUserId = null;
  var failedLogins = 0, lockedUntil = 0;
  /* a user only counts as signed in while their role still exists (old owner/trainer/vip_client accounts do not) */
  function roleOk(u) { return !!u && (u.role === 'admin' || u.role === MEMBER_ROLE); }
  function isStaff(u) { return !!u && STAFF_ROLES.indexOf(u.role) >= 0; }
  function me() { var u = sessionUserId ? S.users[sessionUserId] || null : null; return roleOk(u) ? u : null; }
  function requireUser() { var u = me(); if (!u) throw new AppError('Please sign in first.'); return u; }
  function requireStaff() {
    var u = requireUser();
    if (!isStaff(u)) throw new AppError('Only staff can do this.');
    return u;
  }
  function requireAdmin() {
    var u = requireUser();
    if (u.role !== 'admin') throw new AppError('Only an admin can do this.');
    return u;
  }
  /* why this user may not sign in, or null. Accounts with a removed role are kept in the list so an admin can fix them. */
  function loginBlock(u) {
    if (u.role === 'admin') return null;
    if (u.role === MEMBER_ROLE) return S.clients[u.client] ? null : 'This account is no longer linked to a member. Ask an admin.';
    return 'This role no longer exists. Ask an admin.';
  }
  function memberUserOf(cid) { return values('users').find(function (u) { return u.role === MEMBER_ROLE && u.client === cid; }) || null; }
  function audit(action, detail) {
    var n = now(); var u = me();
    put('audit', { id: uid(), d: n.date, action: action, detail: detail || '', created_at: n.iso, by: u ? u.username : 'anonymous' });
  }

  /* ---------- password hashing: PBKDF2-SHA256 via WebCrypto ---------- */
  function b64(u8) { var s = ''; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  async function derive(pw, salt, iter) {

  }
  function isHashed(s) { return typeof s === 'string' && s.indexOf('pbkdf2_sha256$') === 0; }
  async function verifyPassword(pw, stored) {
    if (!isHashed(stored)) return false;
    var parts = stored.split('$');
    var h = await derive(pw, unb64(parts[2]), parseInt(parts[1], 10));
    var want = unb64(parts[3]); var diff = h.length ^ want.length;

    return diff === 0;
  }
  /* plain-text passwords from an old backup are hashed once, on load */
  async function migratePasswords() {
    var changed = 0;
    for (var u of values('users')) {
      if (!isHashed(u.password)) {
        u.password = await hashPassword(String(u.password || ''));
        put('users', u); changed++;
      }
    }
    return changed;
  }
  async function ensureDefaultAdmin() {
    if (values('users').length) return false;
    var n = now();
    put('users', { id: 'u_admin', username: 'admin', password: await hashPassword('admin123'), role: 'admin', created_at: n.iso });
    return true;
  }

  async function login(username, password) {
    var n = Date.now();
    if (n < lockedUntil) throw new AppError('Too many attempts. Wait ' + Math.ceil((lockedUntil - n) / 1000) + ' seconds.');
    var uname = String(username || '').trim().toLowerCase();
    var u = values('users').find(function (x) { return x.username.toLowerCase() === uname; });
    var ok = false;
    if (u) ok = await verifyPassword(String(password || ''), u.password);
    if (!ok) {
      failedLogins++;
      if (failedLogins >= 5) { lockedUntil = Date.now() + 30000; failedLogins = 0; }
      if (!Store.readOnly) { try { audit('LOGIN_FAILED', 'Username: ' + String(username || '').slice(0, 40)); } catch (e) { /* ignore */ } }
      throw new AppError('Wrong username or password.');
    }
    failedLogins = 0;
    var block = loginBlock(u);
    if (block) {
      if (!Store.readOnly) { try { audit('LOGIN_FAILED', 'Username: ' + u.username); } catch (e) { /* ignore */ } }
      throw new AppError(block);
    }
    sessionUserId = u.id;
    if (!Store.readOnly) { try { audit('LOGIN', u.username); } catch (e) { /* ignore */ } }
    return u;
  }
  function restoreSession(id) { if (id && S.users[id] && roleOk(S.users[id]) && !loginBlock(S.users[id])) { sessionUserId = id; return S.users[id]; } return null; }
  function logout() { var u = me(); if (u && !Store.readOnly) { try { audit('LOGOUT', u.username); } catch (e) { /* ignore */ } } sessionUserId = null; }

  async function changeOwnPassword(current, next, confirm) {
    var u = requireUser();
    if (!(await verifyPassword(String(current || ''), u.password))) throw new AppError('Current password is wrong.');
    if (String(next || '').length < 4) throw new AppError('New password must be at least 4 characters.');
    if (next !== confirm) throw new AppError('The new passwords do not match.');
    u.password = await hashPassword(next); put('users', u);
    audit('PASSWORD_CHANGED', u.username);
  }

  /* ---------- user management: admin only, checked in every function ---------- */
  /* member login accounts live on the member's profile, so they are not listed here; accounts with a removed role are */
  function listUsers() { requireAdmin(); return values('users').filter(function (u) { return u.role !== MEMBER_ROLE; }).sort(function (a, b) { return a.username.localeCompare(b.username); }); }
  function adminCount() { return values('users').filter(function (u) { return u.role === 'admin'; }).length; }
  /* one rule for every username (staff and member logins): format, and unique across ALL users, ignoring case */
  function checkUsername(raw, exceptId) {
    var name = String(raw || '').trim();
    if (!/^[A-Za-z0-9_.-]{3,30}$/.test(name)) throw new AppError('Username: 3 to 30 letters, digits, dots, dashes or underscores.');
    if (values('users').some(function (u) { return u.id !== exceptId && u.username.toLowerCase() === name.toLowerCase(); })) throw new AppError('That username is taken.');
    return name;
  }
  async function addUser(f) {
    requireAdmin();
    var name = checkUsername(f.username);
    if (String(f.password || '').length < 4) throw new AppError('Password must be at least 4 characters.');
    if (ROLES.indexOf(f.role) < 0) throw new AppError('Choose a valid role.');
    var rec = { id: 'u' + uid(), username: name, password: await hashPassword(f.password), role: f.role, created_at: now().iso };
    requireAdmin(); put('users', rec); audit('USER_ADDED', name + ' (' + f.role + ')');
    return rec;
  }
  function setRole(id, role) {
    requireAdmin();
    var u = S.users[id]; if (!u || u.role === MEMBER_ROLE) throw new AppError('User not found.');
    if (ROLES.indexOf(role) < 0) throw new AppError('Choose a valid role.');
    if (u.role === 'admin' && role !== 'admin' && adminCount() <= 1) throw new AppError('The last admin cannot be demoted.');
    var old = u.role; u.role = role; put('users', u); audit('ROLE_CHANGED', u.username + ': ' + old + ' to ' + role);
  }
  function deleteUser(id) {
    var actor = requireAdmin();
    var u = S.users[id]; if (!u || u.role === MEMBER_ROLE) throw new AppError('User not found.');
    if (u.id === actor.id) throw new AppError('You cannot delete your own account.');
    if (u.role === 'admin' && adminCount() <= 1) throw new AppError('The last admin cannot be deleted.');
    del('users', id); audit('USER_DELETED', u.username);
  }
  async function resetPassword(id, pw) {
    requireAdmin();
    var u = S.users[id]; if (!u || u.role === MEMBER_ROLE) throw new AppError('User not found.');
    if (String(pw || '').length < 4) throw new AppError('Password must be at least 4 characters.');
    u.password = await hashPassword(pw); requireAdmin(); put('users', u); audit('PASSWORD_RESET', u.username);
  }

  /* ---------- member logins: one account per member, managed from the member's profile (staff only) ---------- */
  function memberLogin(cid) {
    requireStaff();
    var u = memberUserOf(cid);
    return u ? { username: u.username, created_at: u.created_at } : null;
  }
  async function resetMemberPassword(cid, pw) {
    requireStaff(); needWrite();
    var c = getClient(cid);
    if (!memberUserOf(cid)) throw new AppError('This member has no login.');
    if (String(pw || '').length < 4) throw new AppError('Password must be at least 4 characters.');
    var h = await hashPassword(pw);
    requireStaff(); needWrite();
    var u = memberUserOf(cid); if (!u) throw new AppError('This member has no login.');
    u.password = h; put('users', u);
    audit('MEMBER_LOGIN_RESET', c.name + ': ' + u.username);   /* never the password itself */
  }
  /* checks the optional Login and Password fields of the member form. Returns null (no account wanted) or { login, password }. */
  function parseLogin(f, existing) {
    var login = String(f.login == null ? '' : f.login).trim(), pw = String(f.password == null ? '' : f.password);
    if (!login) {
      if (pw) throw new AppError('Login is required when a password is set.');
      if (existing) throw new AppError('Login is required while the member has an account.');
      return null;
    }
    login = checkUsername(login, existing ? existing.id : null);
    if (!existing && !pw) throw new AppError('Password is required to create a login.');
    if (pw && pw.length < 4) throw new AppError('Password must be at least 4 characters.');
    return { login: login, password: pw };
  }

  /* ---------- validation helpers ---------- */
  function reqText(v, label, max) {
    var s = String(v == null ? '' : v).trim();
    if (!s) throw new AppError(label + ' is required.');
    if (s.length > (max || 120)) throw new AppError(label + ' is too long.');
    return s;
  }
  function num(v, label, o) {
    o = o || {};
    var s = String(v == null ? '' : v).replace(/[\s ,]/g, '');
    if (s === '') { if (o.optional) return null; throw new AppError(label + ' is required.'); }
    var n = Number(s);
    if (!isFinite(n)) throw new AppError(label + ' must be a number.');
    if (o.int && Math.floor(n) !== n) throw new AppError(label + ' must be a whole number.');
    if (o.min != null && n < o.min) throw new AppError(label + ' must be at least ' + o.min + '.');
    if (o.max != null && n > o.max) throw new AppError(label + ' must be at most ' + o.max + '.');
    return n;
  }
  function money(v, label) { var n = num(v, label || 'Amount', { min: 0.01, max: 1e12 }); return round2(n); }
  function normPhone(p) {
    var s = String(p == null ? '' : p).trim();
    return s ? s : null;
  }
  function phoneKey(p) { return String(p || '').replace(/\D/g, ''); }
  function getClient(id) { var c = S.clients[id]; if (!c) throw new AppError('Member not found.'); return c; }
  function normDays(days) {
    var arr = Array.isArray(days) ? days : String(days || '').split(',');
    var set = {}; arr.forEach(function (d) { d = String(d).trim(); if (WEEK.indexOf(d) >= 0) set[d] = 1; });
    return WEEK.filter(function (d) { return set[d]; }).join(',');
  }

  /* ---------- members ---------- */
  function parsePlan(p) {
    var type = p.sub_type;
    if (type !== 'time' && type !== 'sessions') throw new AppError('Choose a subscription type.');
    var start = p.start_date || now().date;
    if (!isDate(start)) throw new AppError('Start date is not valid.');
    var price = num(p.price, 'Price', { min: 0, max: 1e12 });
    var paid = num(p.paid == null || p.paid === '' ? price : p.paid, 'Amount paid', { min: 0, max: 1e12 });
    if (paid > price) throw new AppError('Amount paid cannot be more than the price.');
    var out = { sub_type: type, start_date: start, price: round2(price), paid: round2(paid), end_date: null, total_sessions: 0 };
    if (type === 'time') {
      if (!isDate(p.end_date)) throw new AppError('End date is not valid.');
      if (p.end_date < start) throw new AppError('End date cannot be before the start date.');
      out.end_date = p.end_date;
    } else {
      out.total_sessions = num(p.total_sessions, 'Number of sessions', { min: 1, max: 1000, int: true });
      if (p.end_date) {
        if (!isDate(p.end_date)) throw new AppError('Valid-until date is not valid.');
        if (p.end_date < start) throw new AppError('Valid-until date cannot be before the start date.');
        out.end_date = p.end_date;
      }
    }
    return out;
  }
  function logTxn(type, clientId, category, amount, balance, note, date) {
    var n = now(); var d = date || n.date;
    return put('txns', {
      id: uid(), d: d, client: clientId || null, txn_type: type, category: category || '',
      amount: round2(amount), balance_after: balance == null ? null : round2(balance),
      note: note || '', created_at: d + 'T' + (date ? '12:00:00' : n.iso.slice(11)), by: (me() || {}).username || ''
    });
  }
  function chargeInternal(c, amount, category, note) {
    c.debt = round2((c.debt || 0) + amount); put('clients', c);
    logTxn('charge', c.id, category, amount, c.debt, note);
  }
  function payInternal(c, amount, category, note) {
    c.debt = Math.max(0, round2((c.debt || 0) - amount)); put('clients', c);
    logTxn('payment', c.id, category, amount, c.debt, note);
  }
  function applyPlan(c, p) {
    subsOf(c.id).forEach(function (s) { if (s.is_active) { s.is_active = false; put('subs', s); } });
    var sub = {
      id: uid(), client: c.id, sub_type: p.sub_type, start_date: p.start_date, end_date: p.end_date,
      total_sessions: p.total_sessions, used_sessions: 0, price: p.price, is_active: true, created_at: now().iso
    };
    put('subs', sub);
    c.status = 'active'; c.frozen_since = null; put('clients', c);
    if (p.price > 0) chargeInternal(c, p.price, 'membership', 'Subscription: ' + planLabel(sub));
    if (p.paid > 0) payInternal(c, p.paid, 'membership', 'Paid with subscription');
    audit('SUBSCRIPTION_ADDED', c.name + ': ' + planLabel(sub) + ', price ' + fmtMoney(p.price));
    return sub;
  }
  function checkImage(img) {
    if (img == null || img === '') return null;
    if (typeof img !== 'string' || img.indexOf('data:image/') !== 0) throw new AppError('The photo is not a valid image.');
    if (img.length > 400000) throw new AppError('The photo is too large.');
    return img;
  }
  function checkPhoneFree(phone, exceptId) {
    if (!phone) return;
    var k = phoneKey(phone);
    if (!k) throw new AppError('Phone number must contain digits.');
    var dup = values('clients').find(function (c) { return c.id !== exceptId && c.phone && phoneKey(c.phone) === k; });
    if (dup) throw new AppError('This phone number already belongs to ' + dup.name + '.');
  }
  /* async because an optional member login is hashed here. Everything is checked before the first write. */
  async function createClient(f) {
    requireStaff(); needWrite();
    var name = reqText(f.name, 'Name');
    var phone = normPhone(f.phone); checkPhoneFree(phone, null);
    var image = checkImage(f.image);
    var plan = f.plan && f.plan.sub_type ? parsePlan(f.plan) : null;
    var acct = parseLogin(f, null);
    var hash = acct ? await hashPassword(acct.password) : null;
    requireStaff(); needWrite();
    if (acct) acct.login = checkUsername(acct.login, null);   /* the database may have changed while the password was hashed */
    var c = {
      id: uid(), name: name, phone: phone, note: String(f.note || '').trim().slice(0, 500), image: image,
      created_at: now().iso, status: 'active', frozen_since: null, days: normDays(f.days), debt: 0
    };
    put('clients', c);
    audit('MEMBER_ADDED', name);
    if (plan) applyPlan(c, plan);
    if (acct) {
      put('users', { id: 'u' + uid(), username: acct.login, password: hash, role: MEMBER_ROLE, client: c.id, created_at: now().iso });
      audit('MEMBER_LOGIN_CREATED', name + ': ' + acct.login);
    }
    return c;
  }
  async function updateClient(id, f) {
    requireStaff(); needWrite();
    var c = getClient(id);
    var name = reqText(f.name, 'Name');
    var phone = normPhone(f.phone); checkPhoneFree(phone, id);
    var image = c.image;
    if (f.image !== undefined) image = checkImage(f.image);
    var acct = parseLogin(f, memberUserOf(id));    /* empty password on an existing account = keep the current one */
    var hash = acct && acct.password ? await hashPassword(acct.password) : null;
    requireStaff(); needWrite();
    c = getClient(id);
    var u = memberUserOf(id);
    if (acct) {
      acct.login = checkUsername(acct.login, u ? u.id : null);
      if (!u && !hash) throw new AppError('Password is required to create a login.');
    }
    c.name = name; c.phone = phone; c.note = String(f.note || '').trim().slice(0, 500);
    c.days = normDays(f.days); c.image = image;
    put('clients', c); audit('MEMBER_UPDATED', name);
    if (acct) {
      if (!u) {
        put('users', { id: 'u' + uid(), username: acct.login, password: hash, role: MEMBER_ROLE, client: c.id, created_at: now().iso });
        audit('MEMBER_LOGIN_CREATED', name + ': ' + acct.login);
      } else {
        if (u.username !== acct.login) {
          var was = u.username; u.username = acct.login; put('users', u);
          audit('MEMBER_LOGIN_CHANGED', name + ': ' + was + ' to ' + acct.login);
        }
        if (hash) { u.password = hash; put('users', u); audit('MEMBER_LOGIN_RESET', name + ': ' + u.username); }
      }
    }
    return c;
  }
  function deleteClient(id) {
    requireStaff(); needWrite();
    var c = getClient(id);
    values('users').filter(function (u) { return u.role === MEMBER_ROLE && u.client === id; }).forEach(function (u) {
      del('users', u.id); audit('MEMBER_LOGIN_DELETED', c.name + ': ' + u.username);
    });
    subsOf(id).slice().forEach(function (s) { del('subs', s.id); });
    visitsOf(id).slice().forEach(function (v) { del('visits', v.id); });
    values('measurements').filter(function (m) { return m.client === id; }).forEach(function (m) { del('measurements', m.id); });
    values('txns').filter(function (t) { return t.client === id; }).forEach(function (t) { t.client = null; t.note = (t.note ? t.note + ' ' : '') + '[member: ' + c.name + ']'; put('txns', t); });
    values('sales').filter(function (s) { return s.client === id; }).forEach(function (s) { s.client = null; put('sales', s); });
    del('clients', id); /* the photo lives inside the member record, so it goes too */
    audit('MEMBER_DELETED', c.name);
  }

  function addSubscription(cid, f) {
    requireStaff(); needWrite();
    var c = getClient(cid);
    var plan = parsePlan(f);
    return applyPlan(c, plan);
  }
  function extendSubscription(cid, f) {
    requireStaff(); needWrite();
    var c = getClient(cid); var s = activeSub(cid);
    if (!s) throw new AppError('This member has no active subscription.');
    var days = num(f.days || 0, 'Days', { min: 0, max: 3650, int: true });
    var sess = num(f.sessions || 0, 'Sessions', { min: 0, max: 1000, int: true });
    if (!days && !sess) throw new AppError('Enter days or sessions to add.');
    if (days) {
      if (!s.end_date) throw new AppError('This subscription has no end date to extend.');
      s.end_date = addDays(s.end_date, days);
    }
    if (sess) {
      if (s.sub_type !== 'sessions') throw new AppError('Sessions can only be added to a session-based plan.');
      s.total_sessions += sess;
    }
    put('subs', s);
    audit('SUBSCRIPTION_EXTENDED', c.name + ': +' + days + ' days, +' + sess + ' sessions');
    return s;
  }

  function checkIn(cid) {
    requireStaff(); needWrite();
    var c = getClient(cid); var n = now();
    if (c.status === 'frozen') throw new AppError(c.name + ' is frozen. Unfreeze the membership first.');
    var s = activeSub(cid);
    if (!s) throw new AppError(c.name + ' has no active subscription.');
    var st = subState(s, n.date);
    if (st === 'finished') throw new AppError(c.name + ' has no sessions left.');
    if (st === 'expired') throw new AppError('The subscription of ' + c.name + ' expired on ' + fmtDate(s.end_date) + '.');
    if (visitsOf(cid).some(function (v) { return v.visit_date === n.date; })) throw new AppError(c.name + ' already checked in today.');
    if (c.days && c.days.split(',').indexOf(n.dow) < 0) throw new AppError('Today (' + n.dow + ') is not a training day for ' + c.name + '. Allowed: ' + c.days.replace(/,/g, ', ') + '.');
    var v = put('visits', { id: uid(), d: n.date, client: cid, subscription: s.id, visit_date: n.date, visit_time: n.time });
    if (s.sub_type === 'sessions') { s.used_sessions += 1; put('subs', s); }
    audit('CHECK_IN', c.name);
    return { visit: v, sub: s, remaining: subRemaining(s, n.date), client: c };
  }

  function freezeClient(cid) {
    requireStaff(); needWrite();
    var c = getClient(cid);
    if (c.status === 'frozen') throw new AppError('This membership is already frozen.');
    c.status = 'frozen'; c.frozen_since = now().date; put('clients', c);
    audit('FREEZE', c.name);
  }
  function unfreezeClient(cid) {
    requireStaff(); needWrite();
    var c = getClient(cid);
    if (c.status !== 'frozen') throw new AppError('This membership is not frozen.');
    var n = now(); var days = Math.max(0, diffDays(c.frozen_since || n.date, n.date));
    var s = activeSub(cid); var extended = false;
    if (s && days > 0 && s.end_date) { s.end_date = addDays(s.end_date, days); put('subs', s); extended = true; }
    c.status = 'active'; c.frozen_since = null; put('clients', c);
    audit('UNFREEZE', c.name + ': ' + days + ' frozen days' + (extended ? ', end date extended' : ''));
    return { days: days, extended: extended };
  }

  /* ---------- money: debt is the source of truth, transactions are history ---------- */
  function addPayment(cid, f) {
    requireStaff(); needWrite();
    var c = getClient(cid); var amt = money(f.amount);
    var before = c.debt || 0;
    var cat = PAY_CATS.indexOf(f.category) >= 0 ? f.category : 'membership';
    payInternal(c, amt, cat, String(f.note || '').trim().slice(0, 200));
    audit('PAYMENT', c.name + ': ' + fmtMoney(amt));
    return { debt: c.debt, exceeded: amt > before };
  }
  function addCharge(cid, f) {
    requireStaff(); needWrite();
    var c = getClient(cid); var amt = money(f.amount);
    var cat = PAY_CATS.indexOf(f.category) >= 0 ? f.category : 'other';
    chargeInternal(c, amt, cat, String(f.note || '').trim().slice(0, 200));
    audit('CHARGE', c.name + ': ' + fmtMoney(amt));
    return { debt: c.debt };
  }
  function adjustDebt(cid, f) {
    requireStaff(); needWrite();
    var c = getClient(cid);
    var nd = round2(num(f.debt, 'New debt', { min: 0, max: 1e12 }));
    var old = c.debt || 0; c.debt = nd; put('clients', c);
    logTxn('adjustment', c.id, 'adjustment', Math.abs(nd - old), nd, (String(f.note || '').trim() || 'Debt adjusted') + ' (was ' + fmtMoney(old) + ')');
    audit('DEBT_ADJUSTED', c.name + ': ' + fmtMoney(old) + ' to ' + fmtMoney(nd));
  }

  function addMeasurement(cid, f) {
    requireStaff(); needWrite(); getClient(cid);
    var keys = ['weight', 'height', 'body_fat', 'chest', 'waist', 'bicep'];
    var rec = { id: uid(), client: cid, created_at: now().iso, note: String(f.note || '').trim().slice(0, 200) };
    var any = false;
    keys.forEach(function (k) {
      /* a decimal comma ("82,5") is a decimal here, not a thousands separator: num() would turn it into 825 */
      var v = num(String(f[k] == null ? '' : f[k]).replace(/^(\s*\d+),(\d{1,2})\s*$/, '$1.$2'), k.replace('_', ' '), { optional: true, min: 0, max: 1000 });
      rec[k] = v; if (v != null) any = true;
    });
    if (!any) throw new AppError('Enter at least one measurement.');
    put('measurements', rec); audit('MEASUREMENT_ADDED', getClient(cid).name);
    return rec;
  }
  function deleteMeasurement(id) {
    requireStaff(); var m = S.measurements[id]; if (!m) return;
    del('measurements', id); audit('MEASUREMENT_DELETED', (S.clients[m.client] || {}).name || '');
  }

  /* ---------- shop ---------- */
  function saveProduct(f, id) {
    requireStaff(); needWrite();
    var name = reqText(f.name, 'Product name');
    var p = id ? S.products[id] : null;
    if (id && !p) throw new AppError('Product not found.');
    if (values('products').some(function (x) { return x.id !== id && x.name.toLowerCase() === name.toLowerCase(); })) throw new AppError('A product with this name already exists.');
    var price = round2(num(f.price, 'Price', { min: 0, max: 1e12 }));
    var cost = round2(num(f.cost == null || f.cost === '' ? 0 : f.cost, 'Cost', { min: 0, max: 1e12 }));
    var stock = num(f.stock == null || f.stock === '' ? 0 : f.stock, 'Stock', { min: 0, max: 1e6, int: true });
    var cat = String(f.category || '').trim().slice(0, 40) || 'General';
    /* a new product can record its opening stock as an expense. Checked before anything is saved: product and expense go in together or not at all. */
    var exp = id ? null : stockExpense(f, stock, cost, 'New product: ' + name);
    if (!p) p = { id: uid(), created_at: now().iso };
    p.name = name; p.category = cat; p.price = price; p.cost = cost; p.stock = stock;
    put('products', p); audit(id ? 'PRODUCT_UPDATED' : 'PRODUCT_ADDED', name);
    if (exp) saveExpense(exp);
    return { product: p, expense: exp };
  }
  /* Optional "record as expense" part of a stock purchase. f.expense switches it on; f.expense_amount overrides unit cost x quantity
     (left out = the default, empty or 0 = no expense). Returns a validated expense record, or null. Writes nothing. */
  function stockExpense(f, qty, unitCost, label) {
    if (!f.expense) return null;
    var amt = f.expense_amount == null ? round2(qty * unitCost) : round2(num(f.expense_amount === '' ? 0 : f.expense_amount, 'Expense amount', { min: 0, max: 1e12 }));
    if (!(amt > 0)) return null;
    return expenseRecord({ category: STOCK_CAT, amount: amt, note: label + ' x' + qty });
  }
  function deleteProduct(id) {
    requireStaff(); var p = S.products[id]; if (!p) return;
    del('products', id); audit('PRODUCT_DELETED', p.name);
  }
  function sellProduct(pid, f) {
    requireStaff(); needWrite();
    var p = S.products[pid]; if (!p) throw new AppError('Product not found.');
    var qty = num(f.qty, 'Quantity', { min: 1, max: 1e6, int: true });
    if (qty > p.stock) throw new AppError('Only ' + p.stock + ' in stock.');
    var cid = f.client || null; if (cid) getClient(cid);
    var n = now();
    p.stock -= qty; put('products', p);
    var sale = put('sales', { id: uid(), d: n.date, product: pid, product_name: p.name, client: cid, qty: qty, unit_price: p.price, total: round2(p.price * qty), created_at: n.iso, by: (me() || {}).username || '' });
    audit('SALE', p.name + ' x' + qty + ' = ' + fmtMoney(sale.total));
    return sale;
  }
  function restockProduct(pid, f) {
    requireStaff(); needWrite();
    var p = S.products[pid]; if (!p) throw new AppError('Product not found.');
    var qty = num(f.qty, 'Quantity', { min: 1, max: 1e6, int: true });
    /* optional new unit cost: it becomes the product's cost and is what the expense is based on */
    var unit = f.unit_cost == null || f.unit_cost === '' ? p.cost : round2(num(f.unit_cost, 'Unit cost', { min: 0, max: 1e12 }));
    var exp = stockExpense(f, qty, unit, 'Restock: ' + p.name);
    var oldCost = p.cost;
    p.stock += qty; p.cost = unit; put('products', p);
    audit('RESTOCK', p.name + ' +' + qty + (unit !== oldCost ? ', cost ' + fmtMoney(oldCost) + ' to ' + fmtMoney(unit) : ''));
    if (exp) saveExpense(exp);
    return { product: p, expense: exp };
  }

  /* ---------- finance ---------- */
  /* validates an expense and builds the record; writes nothing, so callers can check first and save later */
  function expenseRecord(f) {
    var cat = EXPENSE_CATS.indexOf(f.category) >= 0 ? f.category : null;
    if (!cat) throw new AppError('Choose an expense category.');
    var amt = money(f.amount);
    var n = now(); var d = f.date || n.date;
    if (!isDate(d)) throw new AppError('Date is not valid.');
    return { id: uid(), category: cat, amount: amt, note: String(f.note || '').trim().slice(0, 200), date: d, created_at: d + 'T' + n.iso.slice(11) };
  }
  function saveExpense(rec) {
    put('expenses', rec);
    audit('EXPENSE_ADDED', rec.category + ': ' + fmtMoney(rec.amount));
    return rec;
  }
  function addExpense(f) {
    requireStaff(); needWrite();
    return saveExpense(expenseRecord(f));
  }
  function deleteExpense(id) {
    requireStaff(); var e = S.expenses[id]; if (!e) return;
    del('expenses', id); audit('EXPENSE_DELETED', e.category + ': ' + fmtMoney(e.amount));
  }
  function addIncome(f) {
    requireStaff(); needWrite();
    var amt = money(f.amount);
    var d = f.date || now().date; if (!isDate(d)) throw new AppError('Date is not valid.');
    var cat = INCOME_CATS.indexOf(f.category) >= 0 ? f.category : 'other';
    var t = logTxn('income', null, cat, amt, null, String(f.note || '').trim().slice(0, 200), d);
    audit('INCOME_ADDED', cat + ': ' + fmtMoney(amt));
    return t;
  }
  function deleteIncome(id) {
    requireStaff(); var t = S.txns[id];
    if (!t || t.txn_type !== 'income') throw new AppError('Only manual income entries can be deleted.');
    del('txns', id); audit('INCOME_DELETED', t.category + ': ' + fmtMoney(t.amount));
  }
  function clientName(id) { requireStaff(); var c = S.clients[id]; return c ? c.name : ''; }

  function financeMonth(ym) {
    requireStaff();
    var income = [], expenses = [];
    var tot = { payments: 0, income: 0, sales: 0, expenses: 0 };
    var daily = {};
    function day(d) { return daily[d] || (daily[d] = { d: d, revenue: 0, expense: 0 }); }
    values('txns').forEach(function (t) {
      if (t.d.slice(0, 7) !== ym) return;
      if (t.txn_type === 'payment') {
        tot.payments += t.amount; day(t.d).revenue += t.amount;
        income.push({ id: t.id, kind: 'payment', d: t.d, at: t.created_at, label: 'Payment: ' + t.category, who: clientName(t.client), amount: t.amount, note: t.note });
      } else if (t.txn_type === 'income') {
        tot.income += t.amount; day(t.d).revenue += t.amount;
        income.push({ id: t.id, kind: 'income', d: t.d, at: t.created_at, label: 'Income: ' + t.category, who: '', amount: t.amount, note: t.note });
      }
    });
    values('sales').forEach(function (s) {
      if (s.d.slice(0, 7) !== ym) return;
      tot.sales += s.total; day(s.d).revenue += s.total;
      income.push({ id: s.id, kind: 'sale', d: s.d, at: s.created_at, label: 'Shop: ' + s.product_name + ' x' + s.qty, who: clientName(s.client), amount: s.total, note: '' });
    });
    var byCat = {};
    values('expenses').forEach(function (e) {
      if (e.date.slice(0, 7) !== ym) return;
      tot.expenses += e.amount; day(e.date).expense += e.amount;
      byCat[e.category] = (byCat[e.category] || 0) + e.amount;
      expenses.push(e);
    });
    income.sort(function (a, b) { return b.at.localeCompare(a.at); });
    expenses.sort(function (a, b) { return b.created_at.localeCompare(a.created_at); });
    var revenue = round2(tot.payments + tot.income + tot.sales);
    return {
      ym: ym, income: income, expenses: expenses, byCat: byCat, daily: daily,
      totals: { payments: round2(tot.payments), income: round2(tot.income), sales: round2(tot.sales), revenue: revenue, expenses: round2(tot.expenses), profit: round2(revenue - tot.expenses) }
    };
  }

  /* ---------- lists, search, pagination ---------- */
  function paginate(list, page, per) {
    var total = list.length; var pages = Math.max(1, Math.ceil(total / per));
    var p = parseInt(page, 10); if (!isFinite(p) || p < 1) p = 1; if (p > pages) p = pages;
    var start = (p - 1) * per;
    return { items: list.slice(start, start + per), page: p, pages: pages, total: total, from: total ? start + 1 : 0, to: Math.min(total, start + per) };
  }
  function memberRows(o) {
    requireStaff();
    o = o || {};
    var today = now().date; var I = idx();
    var q = String(o.q || '').trim().toLowerCase(); var qd = q.replace(/\D/g, '');
    var rows = values('clients').map(function (c) {
      var sub = I.activeSub[c.id] || null;
      return { c: c, status: clientStatus(c, today), sub: sub, remaining: sub ? subRemaining(sub, today) : null, last: I.lastVisit[c.id] || null };
    });
    if (q) rows = rows.filter(function (r) {
      return r.c.name.toLowerCase().indexOf(q) >= 0 || (r.c.phone || '').toLowerCase().indexOf(q) >= 0 || (qd && phoneKey(r.c.phone).indexOf(qd) >= 0);
    });
    var counts = { all: rows.length, active: 0, frozen: 0, expired: 0 };
    rows.forEach(function (r) { counts[r.status]++; });
    if (o.filter && o.filter !== 'all') rows = rows.filter(function (r) { return r.status === o.filter; });
    rows.sort(function (a, b) { return a.c.name.localeCompare(b.c.name); });
    return { rows: rows, counts: counts };
  }

  /* ---------- dashboard, analytics, rankings ---------- */
  function dashboard() {
    requireStaff();
    var n = now(); var I = idx(); var today = n.date;
    var counts = { total: 0, active: 0, frozen: 0, expired: 0 }; var debt = 0; var expiring = [];
    values('clients').forEach(function (c) {
      var st = clientStatus(c, today); counts.total++; counts[st]++; debt += c.debt || 0;
      var s = I.activeSub[c.id];
      if (st === 'active' && s) {
        var rem = subRemaining(s, today);
        if (s.sub_type === 'time' && rem <= 7) expiring.push({ c: c, sub: s, rem: rem, label: rem === 0 ? 'Ends today' : rem + (rem === 1 ? ' day left' : ' days left'), urgency: rem });
        else if (s.sub_type === 'sessions') {
          if (rem <= 2) expiring.push({ c: c, sub: s, rem: rem, label: rem + (rem === 1 ? ' session left' : ' sessions left'), urgency: rem });
          else if (s.end_date) { var dl = diffDays(today, s.end_date); if (dl <= 7) expiring.push({ c: c, sub: s, rem: dl, label: dl === 0 ? 'Ends today' : dl + ' days left', urgency: dl }); }
        }
      }
    });
    expiring.sort(function (a, b) { return a.urgency - b.urgency; });
    var todays = values('visits').filter(function (v) { return v.visit_date === today; }).sort(function (a, b) { return b.visit_time.localeCompare(a.visit_time); });
    var series = [];
    for (var i = 6; i >= 0; i--) { var d = addDays(today, -i); series.push({ d: d, label: dowOf(d), value: I.byDate[d] || 0 }); }
    var fm = financeMonth(today.slice(0, 7));
    return { today: today, counts: counts, debt: round2(debt), expiring: expiring, todays: todays, series: series, month: fm.totals };
  }
  function attendanceSeries(days) {
    requireStaff();
    var today = now().date; var I = idx(); var out = [];
    for (var i = days - 1; i >= 0; i--) { var d = addDays(today, -i); out.push({ d: d, label: d.slice(8, 10), value: I.byDate[d] || 0 }); }
    return out;
  }

/* ===== persistence: shared database (claude db capability) or this browser only ===== */
const Persist = {
  mode: 'memory',          /* 'shared' | 'browser' | 'memory' */
  status: 'idle',          /* idle | saving | saved | error */
  canWrite: true,
  onStatus: null, onRemote: null, onError: null,
  _dl: null, _dbWrites: 0
};

Persist.init = async function (forceLocal) {
  var db = null, user = null;
  if (!forceLocal) {
    try { if (window.claude && window.claude.use) db = await window.claude.use('db'); } catch (e) { db = null; }
    try { if (window.claude && window.claude.use) user = await window.claude.use('user'); } catch (e) { user = null; }
  }
  try { if (window.claude && window.claude.use) Persist._dl = await window.claude.use('downloads'); } catch (e) { Persist._dl = null; }
  if (db) {
    var canWrite = true;
    try { if (user && user.can && user.can('data.write') === false) canWrite = false; } catch (e) { /* keep default */ }
    Persist.canWrite = canWrite; GYM.Store.readOnly = !canWrite;
    await Persist._startShared(db);
    Persist.mode = 'shared';
  } else {
    Persist._startLocal();
    Persist.mode = 'browser';
  }
};

Persist._setStatus = function (s) { Persist.status = s; if (Persist.onStatus) Persist.onStatus(s); };

/* ----- shared database: every table is a collection; busy tables are stored one document per day ----- */
Persist._startShared = async function (db) {
  var pend = new Map();
  function body(t, key) {
    if (GYM.SHARD_OF(t)) { var items = GYM.shardItems(t, key); return items.length ? { items: items } : null; }
    var r = GYM.S()[t][key]; return r || null;
  }
  async function run(path, e) {
    e.running = true; Persist._setStatus('saving');
    var failed = false;
    try {
      do {
        e.dirty = false;
        var b = body(e.t, e.key); var ref = db.doc(path);
        if (b == null) await ref.delete(); else await ref.set(b);
      } while (e.dirty);
      Persist._setStatus('saved');
    } catch (err) {
      failed = true; Persist._setStatus('error');
      if (err && err.code === 'revoked') { GYM.Store.readOnly = true; Persist.canWrite = false; }
      if (Persist.onError) Persist.onError(err);
    } finally {
      e.running = false;
      /* after a failed save, retry only on the next local change, so a lasting error (quota, revoked) cannot loop */
      if (!e.dirty || failed) pend.delete(path); else run(path, e);
    }
  }
  function schedule(t, key) {
    var path = t + '/' + key; var e = pend.get(path);
    if (!e) { e = { t: t, key: key, running: false, dirty: false }; pend.set(path, e); }
    if (e.running) { e.dirty = true; return; }
    run(path, e);
  }
  function keyOf(t, rec) { return GYM.SHARD_OF(t) ? rec.d : rec.id; }
  GYM.Store.write = function (t, rec) { schedule(t, keyOf(t, rec)); };
  GYM.Store.remove = function (t, rec) { schedule(t, keyOf(t, rec)); };
  GYM.Store.replaceAll = function (oldS, newS) {
    var oldP = GYM.allDocPaths(oldS), newP = GYM.allDocPaths(newS);
    Object.keys(newP).forEach(function (p) { schedule(newP[p][0], newP[p][1]); });
    Object.keys(oldP).forEach(function (p) { if (!newP[p]) schedule(oldP[p][0], oldP[p][1]); });
  };

  var waits = [];
  GYM.TABLES.forEach(function (t) {
    var first = true;
    waits.push(new Promise(function (resolve) {
      db.collection(t).onSnapshot(function (snap) {
        var changed = false;
        snap.docChanges().forEach(function (ch) {
          var d = ch.doc; var path = t + '/' + d.id;
          if (pend.has(path)) return;                         /* a local write is still on its way */
          if (d.metadata && d.metadata.hasPendingWrites) return;
          /* the database hands out frozen (read-only) objects; keep a plain copy so the rules can edit records in place */
          var b = ch.type === 'removed' ? null : JSON.parse(JSON.stringify(d.data()));
          if (GYM.applyRemote(t, d.id, b)) changed = true;
        });
        if (changed && !first && Persist.onRemote) Persist.onRemote();
        if (first && !(snap.metadata && snap.metadata.fromCache)) { first = false; resolve(); }
      }, function (err) {
        if (err && err.code === 'revoked') { GYM.Store.readOnly = true; Persist.canWrite = false; }
        if (first) { first = false; resolve(); }
        if (Persist.onError) Persist.onError(err);
      });
    }));
  });
  var timer;
  var timeout = new Promise(function (_, rej) { timer = setTimeout(function () { rej(new Error('timeout')); }, 15000); });
  try { await Promise.race([Promise.all(waits), timeout]); } finally { clearTimeout(timer); }
};

/* ----- this browser only (localStorage), used when the shared database is not available ----- */
Persist._startLocal = function () {
  var KEY = 'gympro.v1'; var timer = null; var ok = true;
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) GYM.loadState(JSON.parse(raw));
  } catch (e) { ok = false; }
  function save() {
    clearTimeout(timer);
    timer = setTimeout(function () {
      try { localStorage.setItem(KEY, JSON.stringify(GYM.S())); Persist._setStatus('saved'); }
      catch (e) { Persist._setStatus('error'); if (Persist.onError) Persist.onError(e); }
    }, 250);
  }
  GYM.Store.write = save; GYM.Store.remove = save; GYM.Store.replaceAll = save;
  Persist.localOk = ok;
};

Persist.saveFile = async function (filename, data) {
  if (!Persist._dl) throw new GYM.AppError('Downloads are not available in this view.');
  try { return await Persist._dl.save({ filename: filename, data: data }); }
  catch (e) {
    if (e && e.code === 'declined') return null;
    throw new GYM.AppError('The file could not be saved (' + ((e && e.code) || 'error') + ').');
  }
};

/* ----- modal ----- */
var modals = []; var pendingRender = false;
function openModal(o) {
  var root = $('#modal-root'); var prev = document.activeElement;
  var wrap = document.createElement('div'); wrap.className = 'modal-wrap';
  wrap.innerHTML = '<div class="modal' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(o.title) + '">' +
    '<header><h3>' + esc(o.title) + '</h3><button type="button" class="btn icon-btn" data-close aria-label="Close">' + ic('x') + '</button></header>' +
    '<form novalidate><div class="mb">' + o.body + '<div class="form-error" role="alert" hidden></div></div>' +
    '<footer><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn ' + (o.danger ? 'btn-danger solid' : 'btn-primary') + '">' + esc(o.submit || 'Save') + '</button></footer></form></div>';
  root.appendChild(wrap); modals.push(wrap);
  var form = $('form', wrap); var errEl = $('.form-error', wrap); var sbtn = $('[type=submit]', form);
  var done = false;
  function close(result) {
    if (done) return; done = true;
    wrap.remove(); modals.splice(modals.indexOf(wrap), 1);
    if (o.onClose) o.onClose(result === true);
    if (prev && prev.focus && document.contains(prev)) prev.focus();
    if (!modals.length && pendingRender) { pendingRender = false; if (window.APP) window.APP.render(); }
  }
  wrap.addEventListener('mousedown', function (e) { if (e.target === wrap) close(false); });
  wrap.addEventListener('click', function (e) { if (e.target.closest('[data-close]')) close(false); });
  form.addEventListener('submit', async function (e) {
    e.preventDefault(); errEl.hidden = true; sbtn.disabled = true;
    try {
      var r = await o.onSubmit(new FormData(form), form);
      if (r !== false) close(true);
    } catch (err) {
      errEl.textContent = err instanceof G.AppError ? err.message : 'Something went wrong: ' + (err && err.message);
      errEl.hidden = false; if (!(err instanceof G.AppError)) console.error(err);
    } finally { sbtn.disabled = false; }
  });
  if (o.onOpen) o.onOpen(wrap, form);
  setTimeout(function () {
    var f = $('input:not([type=hidden]):not([type=file]):not([type=checkbox]),select,textarea', form); if (f) f.focus();
  }, 20);
  return { close: close, wrap: wrap, form: form };
}
function confirmBox(o) {
  return new Promise(function (resolve) {
    openModal({
      title: o.title, body: '<p>' + (o.html || esc(o.text || '')) + '</p>', submit: o.confirm || 'Confirm', danger: o.danger,
      onSubmit: function () { return true; }, onClose: function (ok) { resolve(ok); }

}
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && modals.length) { var w = modals[modals.length - 1]; var b = $('[data-close]', w); if (b) b.click(); }
  else if (e.key === 'Escape' && isNarrow() && drawerOpen()) { closeDrawer(); $('#menu-btn').focus(); }   /* one Escape does one thing: a modal first */
});

/* ----- photo upload: shrink to a 320px JPEG so it fits inside the member record ----- */
function readImage(file) {
  return new Promise(function (res, rej) {
    if (!file || !/^image\//.test(file.type)) return rej(new G.AppError('Choose an image file.'));
    var fr = new FileReader();
    fr.onerror = function () { rej(new G.AppError('The photo could not be read.')); };
    fr.onload = function () {
      var img = new Image();
      img.onerror = function () { rej(new G.AppError('The photo could not be read.')); };
      img.onload = function () {
        var M = 320, k = Math.min(1, M / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ----- charts (drawn to one scale; text uses theme tokens) ----- */
function niceMax(v) {
  var m = 4; while (m < v) m = m < 20 ? m + 4 : (m < 100 ? m + 20 : m * 2);
  return m;
}
function barChart(data, o) {
  o = o || {};
  var w = o.w || 640, h = o.h || 220, padL = 34, padR = 8, padT = 20, padB = 26;
  var iw = w - padL - padR, ih = h - padT - padB, n = data.length;
  var max = niceMax(Math.max.apply(null, data.map(function (d) { return d.value; }).concat([1])));
  var s = '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(o.label || 'Bar chart') + '">';
  for (var i = 0; i <= 4; i++) {
    var y = padT + ih - ih * i / 4;
    s += '<line class="gl" x1="' + padL + '" x2="' + (w - padR) + '" y1="' + y + '" y2="' + y + '"/>';
    s += '<text x="' + (padL - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + (max * i / 4) + '</text>';
  }
  var slot = iw / n, bw = Math.min(40, slot * 0.62);
  data.forEach(function (d, k) {
    var bh = ih * d.value / max, x = padL + k * slot + (slot - bw) / 2, y2 = padT + ih - bh;
    var hi = o.hiLast !== false && k === n - 1;
    if (d.value > 0) s += '<rect class="cb' + (hi ? ' hi' : '') + '" x="' + x.toFixed(1) + '" y="' + y2.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="2"><title>' + esc(d.title || d.label) + ': ' + d.value + '</title></rect>';
    if (d.value > 0 && n <= 16) s += '<text class="val" x="' + (x + bw / 2).toFixed(1) + '" y="' + (y2 - 5).toFixed(1) + '" text-anchor="middle">' + d.value + '</text>';
    var every = o.labelEvery || 1;
    if (k % every === 0 || k === n - 1) s += '<text x="' + (padL + k * slot + slot / 2).toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle">' + esc(d.label) + '</text>';
  });
  return s + '</svg>';
}
function hbars(items, fmt) {
  var max = Math.max.apply(null, items.map(function (i) { return i.value; }).concat([1]));
  if (!items.length) return '<div class="empty">Nothing recorded this month.</div>';
  return '<div class="hbars">' + items.map(function (i) {
    return '<div class="row"><span class="small">' + esc(i.label) + '</span><div class="bar"><i style="width:' + Math.max(2, Math.round(100 * i.value / max)) + '%"></i></div><b class="num small">' + (fmt ? fmt(i.value) : i.value) + '</b></div>';
  }).join('') + '</div>';
}
function lineSpark(vals) {
  if (vals.length < 2) return '';
  var w = 140, h = 36, p = 4, mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), rg = (mx - mn) || 1;
  var pts = vals.map(function (v, i) { return [p + i * (w - 2 * p) / (vals.length - 1), h - p - (v - mn) / rg * (h - 2 * p)]; });
  var last = pts[pts.length - 1];
  return '<svg class="chart" style="width:140px" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Weight trend"><polyline fill="none" stroke="var(--bar)" stroke-width="2" stroke-linejoin="round" points="' + pts.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ') + '"/><circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3.5" fill="var(--bar-hi)"/></svg>';
}
/* exported files follow the interface language: headings, statuses, month names */
function lcell(c) { return typeof c === 'string' ? I18N.tr(c) : (c == null ? '' : c); }
function csvText(rows) {
  return '﻿' + rows.map(function (r) {
    return r.map(function (c) { var s = lcell(c); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',');
  }).join('\r\n');
}
function sheet(rows, widths) {
  var ws = XLSX.utils.aoa_to_sheet(rows);
  if (widths) ws['!cols'] = widths.map(function (w) { return { wch: w }; });
  return ws;
}
async function saveXlsx(name, sheets) {
  if (typeof XLSX === 'undefined') throw new G.AppError('The Excel library could not be loaded.');
  var wb = XLSX.utils.book_new();
  sheets.forEach(function (s) { XLSX.utils.book_append_sheet(wb, sheet(s.rows.map(function (r) { return r.map(lcell); }), s.widths), I18N.tr(s.name)); });
  var buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  return Persist.saveFile(name, buf);
}

function wirePlan(form, withNone) {
  var selEl = form.elements.sub_type; var box = $('[data-plan]', form);
  function sync() {
    var v = selEl.value;
    if (withNone) box.hidden = !v;
    $$('[data-for]', form).forEach(function (e) { e.hidden = e.dataset.for !== (v || 'time'); });
  }
  selEl.addEventListener('change', sync); sync();
  form.addEventListener('click', function (e) {
    var b = e.target.closest('[data-preset]'); if (!b) return;
    var start = form.elements.start_date.value || todayStr();
    form.elements.end_date.value = G.addDays(start, parseInt(b.dataset.preset, 10) - 1);
  });
}
function readPlan(fd) {

    sub_type: type, start_date: fd.get('start_date'),

  };
}
